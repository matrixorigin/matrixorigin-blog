<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img"><title>The User Runner boundary</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/></marker></defs><rect width="900" height="440" fill="#ffffff"/><rect x="40.0" y="40.0" width="360.0" height="200.0" rx="7" fill="#fbefff" stroke="#8250df" stroke-width="1.4"/><text x="220.0" y="68.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="0" fill="#1f2328">Astra Server (control)</text><text x="64.0" y="100.0" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#1f2328">Work · identity · context</text><text x="64.0" y="124.0" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#1f2328">Policy · Provider Admission</text><text x="64.0" y="148.0" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#1f2328">Checkpoints · recovery</text><text x="64.0" y="172.0" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#1f2328">Trace · Audit</text><text x="220.0" y="222.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" letter-spacing="0" fill="#59636e">Server-only gets no file / shell / Git access by default</text><rect x="500.0" y="40.0" width="360.0" height="200.0" rx="7" fill="none" stroke="#1a7f37" stroke-width="1.4" stroke-dasharray="6 4"/><text x="512.0" y="32.0" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.8" fill="#59636e">USER / ENTERPRISE TRUST BOUNDARY</text><rect x="520.0" y="58.0" width="320.0" height="52.0" rx="7" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.4"/><text x="680.0" y="79.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="0" fill="#1f2328">User Runner</text><text x="680.0" y="96.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" letter-spacing="0" fill="#59636e">CLI local runtime · Edge</text><rect x="520.0" y="128.0" width="320.0" height="96.0" rx="7" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.4"/><text x="680.0" y="152.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="0" fill="#1f2328">Capabilities and credentials already there</text><text x="680.0" y="176.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" letter-spacing="0" fill="#1f2328">workspace · shell · Git · builds</text><text x="680.0" y="196.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" letter-spacing="0" fill="#1f2328">private services · DB clients · local MCP</text><path d="M680.0 110.0 L680.0 128.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><path d="M400 100 L500 100" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><text x="450.0" y="92.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" letter-spacing="0" fill="#59636e">admitted tool call</text><path d="M500 180 L400 180" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><text x="450.0" y="172.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" letter-spacing="0" fill="#59636e">result + evidence</text><rect x="40.0" y="280.0" width="400.0" height="110.0" rx="7" fill="#fbefff" stroke="#8250df" stroke-width="1.4"/><text x="240.0" y="306.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="0" fill="#1f2328">What travels with the user</text><text x="240.0" y="334.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" letter-spacing="0" fill="#1f2328">Work · context · checkpoints · evidence</text><text x="240.0" y="356.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" letter-spacing="0" fill="#1f2328">Tasks survive a Runner going offline</text><rect x="460.0" y="280.0" width="400.0" height="110.0" rx="7" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.4"/><text x="660.0" y="306.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="0" fill="#1f2328">What stays in place</text><text x="660.0" y="334.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" letter-spacing="0" fill="#1f2328">Private code · credentials · network · policy</text><text x="660.0" y="356.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" letter-spacing="0" fill="#1f2328">Nothing is uploaded to move a task</text><text x="450.0" y="420.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#59636e">What crosses is the execution site; what stays constant is task identity and runtime fact</text></svg>
