<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img"><title>What can be rolled back, and what cannot</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/></marker></defs><rect width="900" height="420" fill="#ffffff"/><rect x="40.0" y="40.0" width="150.0" height="54.0" rx="7" fill="#fbefff" stroke="#8250df" stroke-width="1.4"/><text x="115.0" y="62.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" letter-spacing="0" fill="#1f2328">Session</text><text x="115.0" y="79.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" letter-spacing="0" fill="#59636e">continuity</text><path d="M190.0 67.0 L207.5 67.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><rect x="207.5" y="40.0" width="150.0" height="54.0" rx="7" fill="#fbefff" stroke="#8250df" stroke-width="1.4"/><text x="282.5" y="62.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" letter-spacing="0" fill="#1f2328">Run</text><text x="282.5" y="79.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" letter-spacing="0" fill="#59636e">one controlled execution</text><path d="M357.5 67.0 L375.0 67.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><rect x="375.0" y="40.0" width="150.0" height="54.0" rx="7" fill="#fbefff" stroke="#8250df" stroke-width="1.4"/><text x="450.0" y="62.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" letter-spacing="0" fill="#1f2328">Turn</text><text x="450.0" y="79.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" letter-spacing="0" fill="#59636e">one decision</text><path d="M525.0 67.0 L542.5 67.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><rect x="542.5" y="40.0" width="150.0" height="54.0" rx="7" fill="#fbefff" stroke="#8250df" stroke-width="1.4"/><text x="617.5" y="62.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" letter-spacing="0" fill="#1f2328">Tool call</text><text x="617.5" y="79.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" letter-spacing="0" fill="#59636e">identity · permission</text><path d="M692.5 67.0 L710.0 67.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><rect x="710.0" y="40.0" width="150.0" height="54.0" rx="7" fill="#f6f8fa" stroke="#59636e" stroke-width="1.4"/><text x="785.0" y="62.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" letter-spacing="0" fill="#1f2328">A change</text><text x="785.0" y="79.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" letter-spacing="0" fill="#59636e">pre-state captured</text><rect x="40.0" y="110.0" width="820.0" height="30.0" rx="7" fill="#f6f8fa" stroke="#59636e" stroke-width="1.4"/><text x="450.0" y="129.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" letter-spacing="0" fill="#1f2328">Trace: every captured change links to its Session / Run / Turn / tool / identity / permission / result</text><rect x="40.0" y="164.0" width="400.0" height="196.0" rx="7" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.4"/><text x="240.0" y="190.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" letter-spacing="0" fill="#1f2328">Pre-state captured: can be rolled back</text><text x="64.0" y="218.0" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" letter-spacing="0" fill="#1f2328">File writes · pre-image kept, undo by file or Turn</text><text x="64.0" y="242.0" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" letter-spacing="0" fill="#1f2328">Session config · task state · compaction marks</text><text x="64.0" y="266.0" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" letter-spacing="0" fill="#1f2328">MatrixOne writes · snapshot taken before the change</text><text x="64.0" y="290.0" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" letter-spacing="0" fill="#1f2328">Git changes · explicit revert</text><text x="240.0" y="340.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" letter-spacing="0" fill="#59636e">Rollback itself passes policy checks and enters Trace</text><rect x="460.0" y="164.0" width="400.0" height="196.0" rx="7" fill="#ffebe9" stroke="#cf222e" stroke-width="1.4"/><text x="660.0" y="190.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" letter-spacing="0" fill="#1f2328">May be irreversible: restrict first, keep evidence</text><text x="484.0" y="218.0" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" letter-spacing="0" fill="#1f2328">Sending messages · external API calls · publishing</text><text x="484.0" y="242.0" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" letter-spacing="0" fill="#1f2328">Before: Policy · Approval · Provider Admission</text><text x="484.0" y="266.0" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" letter-spacing="0" fill="#1f2328">After: evidence lands in Trace and Audit</text><text x="660.0" y="340.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" letter-spacing="0" fill="#59636e">We do not promise that everything can be undone</text><path d="M240 140 L240 164" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><path d="M660 140 L660 164" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><text x="450.0" y="396.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#59636e">Find the change and its cause first, then return the recoverable ones to a known state</text></svg>
