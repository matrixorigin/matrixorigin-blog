<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img"><title>One enterprise task, many locations</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/></marker></defs><rect width="900" height="380" fill="#ffffff"/><rect x="40.0" y="40.0" width="150.0" height="56.0" rx="7" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/><text x="115.0" y="63.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" letter-spacing="0" fill="#1f2328">Web console</text><text x="115.0" y="80.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" letter-spacing="0" fill="#59636e">failure analysis starts</text><text x="115.0" y="118.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" letter-spacing="0" fill="#59636e">browser closed, task lives</text><path d="M190.0 68.0 L207.5 68.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><rect x="207.5" y="40.0" width="150.0" height="56.0" rx="7" fill="#fbefff" stroke="#8250df" stroke-width="1.4"/><text x="282.5" y="63.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" letter-spacing="0" fill="#1f2328">Astra Server</text><text x="282.5" y="80.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" letter-spacing="0" fill="#59636e">keeps Work and context</text><text x="282.5" y="118.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" letter-spacing="0" fill="#59636e">offline, state kept</text><path d="M357.5 68.0 L375.0 68.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><rect x="375.0" y="40.0" width="150.0" height="56.0" rx="7" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.4"/><text x="450.0" y="63.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" letter-spacing="0" fill="#1f2328">Developer laptop</text><text x="450.0" y="80.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" letter-spacing="0" fill="#59636e">reads code, runs tests</text><text x="450.0" y="118.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" letter-spacing="0" fill="#59636e">code stays local</text><path d="M525.0 68.0 L542.5 68.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><rect x="542.5" y="40.0" width="150.0" height="56.0" rx="7" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.4"/><text x="617.5" y="63.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" letter-spacing="0" fill="#1f2328">Private network</text><text x="617.5" y="80.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" letter-spacing="0" fill="#59636e">queries an internal service</text><text x="617.5" y="118.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" letter-spacing="0" fill="#59636e">credentials stay put</text><path d="M692.5 68.0 L710.0 68.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><rect x="710.0" y="40.0" width="150.0" height="56.0" rx="7" fill="#fff8c5" stroke="#bf8700" stroke-width="1.4"/><text x="785.0" y="63.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" letter-spacing="0" fill="#1f2328">Approval</text><text x="785.0" y="80.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" letter-spacing="0" fill="#59636e">a permitted human confirms</text><text x="785.0" y="118.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" letter-spacing="0" fill="#59636e">history stays visible</text><rect x="40.0" y="150.0" width="820.0" height="44.0" rx="7" fill="#fbefff" stroke="#8250df" stroke-width="1.4"/><text x="450.0" y="177.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" letter-spacing="0" fill="#1f2328">One Work: identity · task state · checkpoints · policy decisions · evidence chain</text><path d="M115.0 126.0 L115.0 150.0" fill="none" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="3 3"/><path d="M282.5 126.0 L282.5 150.0" fill="none" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="3 3"/><path d="M450.0 126.0 L450.0 150.0" fill="none" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="3 3"/><path d="M617.5 126.0 L617.5 150.0" fill="none" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="3 3"/><path d="M785.0 126.0 L785.0 150.0" fill="none" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="3 3"/><text x="40.0" y="232.0" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.7" fill="#59636e">THREE RECURRING TENSIONS</text><rect x="40.0" y="244.0" width="260.0" height="96.0" rx="7" fill="#f6f8fa" stroke="#59636e" stroke-width="1.4"/><text x="170.0" y="272.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" letter-spacing="0" fill="#1f2328">Work must persist</text><text x="170.0" y="292.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" letter-spacing="0" fill="#1f2328">but context cannot grow forever</text><text x="170.0" y="320.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" letter-spacing="0" fill="#59636e">tokens, stale conflicts, lost facts</text><rect x="320.0" y="244.0" width="260.0" height="96.0" rx="7" fill="#f6f8fa" stroke="#59636e" stroke-width="1.4"/><text x="450.0" y="272.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" letter-spacing="0" fill="#1f2328">Agents must act</text><text x="450.0" y="292.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" letter-spacing="0" fill="#1f2328">but changes cannot be a black box</text><text x="450.0" y="320.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" letter-spacing="0" fill="#59636e">who changed what, why, can it be undone</text><rect x="600.0" y="244.0" width="260.0" height="96.0" rx="7" fill="#f6f8fa" stroke="#59636e" stroke-width="1.4"/><text x="730.0" y="272.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" letter-spacing="0" fill="#1f2328">Work must cross environments</text><text x="730.0" y="292.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" letter-spacing="0" fill="#1f2328">but privileges must not follow</text><text x="730.0" y="320.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" letter-spacing="0" fill="#59636e">code, credentials, network stay put</text></svg>
