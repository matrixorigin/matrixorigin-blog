<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img"><title>The five ContextPipe stages</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/></marker></defs><rect width="900" height="430" fill="#ffffff"/><text x="190.0" y="62.0" text-anchor="end" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" letter-spacing="0" fill="#1f2328">Conversation history</text><path d="M198.0 58.0 L226.0 58.0" fill="none" stroke="#8c959f" stroke-width="1.4"/><text x="190.0" y="88.0" text-anchor="end" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" letter-spacing="0" fill="#1f2328">System rules</text><path d="M198.0 84.0 L226.0 84.0" fill="none" stroke="#8c959f" stroke-width="1.4"/><text x="190.0" y="114.0" text-anchor="end" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" letter-spacing="0" fill="#1f2328">Task state · Work</text><path d="M198.0 110.0 L226.0 110.0" fill="none" stroke="#8c959f" stroke-width="1.4"/><text x="190.0" y="140.0" text-anchor="end" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" letter-spacing="0" fill="#1f2328">Memory · enterprise facts</text><path d="M198.0 136.0 L226.0 136.0" fill="none" stroke="#8c959f" stroke-width="1.4"/><text x="190.0" y="166.0" text-anchor="end" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" letter-spacing="0" fill="#1f2328">Artifacts · tool results</text><path d="M198.0 162.0 L226.0 162.0" fill="none" stroke="#8c959f" stroke-width="1.4"/><text x="190.0" y="192.0" text-anchor="end" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" letter-spacing="0" fill="#1f2328">Runtime · policy</text><path d="M198.0 188.0 L226.0 188.0" fill="none" stroke="#8c959f" stroke-width="1.4"/><path d="M226.0 58.0 L226.0 188.0" fill="none" stroke="#8c959f" stroke-width="1.4"/><path d="M226.0 123.0 L262.0 123.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><text x="40.0" y="36.0" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.7" fill="#59636e">CONTEXT SOURCES, WITH PROVENANCE</text><rect x="262.0" y="96.0" width="118.0" height="54.0" rx="7" fill="#fbefff" stroke="#8250df" stroke-width="1.4"/><text x="321.0" y="118.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="0" fill="#1f2328">Plan</text><text x="321.0" y="135.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" letter-spacing="0" fill="#59636e">needs of this step</text><path d="M380.0 123.0 L402.0 123.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><rect x="402.0" y="96.0" width="118.0" height="54.0" rx="7" fill="#fbefff" stroke="#8250df" stroke-width="1.4"/><text x="461.0" y="118.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="0" fill="#1f2328">Bind</text><text x="461.0" y="135.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" letter-spacing="0" fill="#59636e">bind to real sources</text><path d="M520.0 123.0 L542.0 123.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><rect x="542.0" y="96.0" width="118.0" height="54.0" rx="7" fill="#fbefff" stroke="#8250df" stroke-width="1.4"/><text x="601.0" y="118.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="0" fill="#1f2328">Optimize</text><text x="601.0" y="135.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" letter-spacing="0" fill="#59636e">budget · relevance</text><path d="M660.0 123.0 L682.0 123.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><rect x="682.0" y="96.0" width="118.0" height="54.0" rx="7" fill="#fbefff" stroke="#8250df" stroke-width="1.4"/><text x="741.0" y="118.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="0" fill="#1f2328">Execute</text><text x="741.0" y="135.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" letter-spacing="0" fill="#59636e">select · compress</text><path d="M800.0 123.0 L822.0 123.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><rect x="822.0" y="96.0" width="78.0" height="54.0" rx="7" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/><text x="861.0" y="118.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" letter-spacing="0" fill="#1f2328">model</text><text x="861.0" y="135.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" letter-spacing="0" fill="#59636e">one call</text><text x="262.0" y="84.0" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" letter-spacing="1" fill="#59636e">CONTEXTPIPE</text><rect x="262.0" y="62.0" width="558.0" height="100.0" rx="7" fill="none" stroke="#8250df" stroke-width="1.4" stroke-dasharray="4 4"/><path d="M861.0 150.0 L861.0 208.0" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><rect x="262.0" y="208.0" width="558.0" height="44.0" rx="7" fill="#fff8c5" stroke="#bf8700" stroke-width="1.4"/><text x="541.0" y="234.5" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="0" fill="#1f2328">Feedback: real tokens · latency · cache hits · result quality, fed into later runs</text><path d="M262 230 L236 230 L236 123" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><text x="860.0" y="300.0" text-anchor="end" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" letter-spacing="1" fill="#59636e">PROMPT-EXTERNAL DURABLE STATE</text><rect x="40.0" y="310.0" width="820.0" height="54.0" rx="7" fill="#f6f8fa" stroke="#59636e" stroke-width="1.4"/><text x="450.0" y="333.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="0" fill="#1f2328">Work · versioned task graph · checkpoints · run events · execution evidence</text><text x="450.0" y="351.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" letter-spacing="0" fill="#59636e">Each model call rebuilds only what this decision needs; work continues across requests and reconnects</text><path d="M120 310 L120 200" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/><text x="128.0" y="260.0" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" letter-spacing="0" fill="#59636e">loaded on demand</text><text x="450.0" y="405.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" letter-spacing="0" fill="#59636e">The append-only alternative: concatenate all history into the prompt, then compress when the window runs out</text></svg>
