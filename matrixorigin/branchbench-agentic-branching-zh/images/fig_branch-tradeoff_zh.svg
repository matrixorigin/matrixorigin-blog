<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#161B22" stroke-width="1"/></pattern>
    <marker id="ax" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#6E7681"/></marker>
  </defs>
  <rect width="1200" height="500" fill="#0D1117"/><rect width="1200" height="500" fill="url(#g)"/>
  <text x="44" y="40" fill="#E6EDF3" font-size="22" font-weight="700">一个结构性的取舍：现有系统只占了两个角，右上角是空的</text>

  <!-- axes -->
  <line x1="120" y1="410" x2="640" y2="410" stroke="#6E7681" stroke-width="1.6" marker-end="url(#ax)"/>
  <line x1="120" y1="410" x2="120" y2="90" stroke="#6E7681" stroke-width="1.6" marker-end="url(#ax)"/>
  <text x="634" y="430" fill="#9DA7B3" font-size="11.5" font-weight="700" text-anchor="end">分支管理越便宜 ▶</text>
  <text x="120" y="78" fill="#9DA7B3" font-size="11.5" font-weight="700" text-anchor="middle">分支内查询越快</text>

  <!-- empty quadrant -->
  <rect x="392" y="112" width="230" height="132" rx="10" fill="#0F1622" stroke="#3FB950" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="507" y="152" fill="#3FB950" font-size="13" text-anchor="middle" font-weight="700">这里是空的</text>
  <text x="507" y="176" fill="#9DA7B3" font-size="11" text-anchor="middle">便宜 · 高并发 · 且查询高效</text>
  <text x="507" y="200" fill="#6E7681" font-size="10.5" text-anchor="middle">再加上一个所有系统都缺的：</text>
  <text x="507" y="220" fill="#F0883E" font-size="11" text-anchor="middle" font-weight="700">原生跨分支聚合</text>
  <text x="507" y="240" fill="#6E7681" font-size="10" text-anchor="middle">“That system does not exist yet.”</text>

  <!-- Neon -->
  <circle cx="186" cy="150" r="9" fill="#79C0FF"/>
  <text x="204" y="146" fill="#E6EDF3" font-size="13" font-weight="700">Neon</text>
  <text x="204" y="166" fill="#6E7681" font-size="10.5">每分支一个 compute 实例</text>
  <text x="204" y="183" fill="#F85149" font-size="10.5">建分支慢 25× · 切分支慢 1500×</text>
  <text x="204" y="200" fill="#F85149" font-size="10.5">并发 live 分支硬上限 20 条</text>

  <!-- Dolt -->
  <circle cx="560" cy="352" r="9" fill="#A371F7"/>
  <text x="234" y="290" fill="#E6EDF3" font-size="13" font-weight="700">Dolt</text>
  <text x="234" y="310" fill="#6E7681" font-size="10.5">内容寻址树，分支≈改个指针</text>
  <text x="234" y="327" fill="#F85149" font-size="10.5">范围扫描慢 2–4000×</text>
  <text x="234" y="344" fill="#F85149" font-size="10.5">吞吐在 4 条分支就到顶</text>
  <path d="M400 330 C 470 336, 520 344, 549 351" fill="none" stroke="#30363D" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- others -->
  <circle cx="150" cy="372" r="6" fill="#6E7681"/>
  <text x="166" y="376" fill="#6E7681" font-size="10.5">Xata / TigerData：建分支慢几个数量级，成熟度不足</text>
  <circle cx="150" cy="396" r="6" fill="#6E7681"/>
  <text x="166" y="400" fill="#6E7681" font-size="10.5">PG 事务/savepoint、file-copy clone：只在极窄的场景成立</text>

  <!-- right panel -->
  <rect x="700" y="90" width="456" height="322" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.3"/>
  <text x="720" y="116" fill="#E6EDF3" font-size="13" font-weight="700">两个失败模式，都是架构后果，不是调优问题</text>

  <text x="720" y="148" fill="#79C0FF" font-size="12" font-weight="700">Neon · 20 条上限</text>
  <text x="720" y="168" fill="#9DA7B3" font-size="11">每条分支绑一个 compute 实例 → 查询快、并发读吞吐近线性，</text>
  <text x="720" y="186" fill="#9DA7B3" font-size="11">但建/切分支贵，而且撞上硬上限就停。</text>
  <text x="720" y="206" fill="#6E7681" font-size="10.5">MCTS 1000 步只完成 33 步 · Software Dev 存储开销 4.0 GB</text>

  <text x="720" y="240" fill="#A371F7" font-size="12" font-weight="700">Dolt · 4 条平台期</text>
  <text x="720" y="260" fill="#9DA7B3" font-size="11">所有分支跑在同一个进程、共享固定资源池 → 分支近乎免费，</text>
  <text x="720" y="278" fill="#9DA7B3" font-size="11">但加分支不带来算力，读还要遍历随分支数变长的树。</text>
  <text x="720" y="298" fill="#6E7681" font-size="10.5">MCTS 完成 170/1000 步 · Simulation 未能优雅结束</text>

  <line x1="720" y1="318" x2="1136" y2="318" stroke="#21262D" stroke-width="1.2"/>
  <text x="720" y="342" fill="#3FB950" font-size="12" font-weight="700">一个有意思的对照（微基准）</text>
  <text x="720" y="362" fill="#9DA7B3" font-size="11">单分支扩展性：分支总数增加不拖慢单分支读 —— 两家的隔离都对。</text>
  <text x="720" y="382" fill="#9DA7B3" font-size="11">多分支扩展性：Neon 近线性（到 20 封顶），Dolt 4 条即平。</text>
  <text x="720" y="400" fill="#6E7681" font-size="10.5">差别不在“隔离做得好不好”，而在“加分支能不能加算力”。</text>

  <text x="44" y="448" fill="#6E7681" font-size="11.5">数据来自 BranchBench（arXiv:2604.17180）。Neon 通过其托管服务测试，Dolt 自建于 c8i.4xlarge；论文自陈 Neon 的存储统计只能作数量级参考。</text>
  <text x="44" y="470" fill="#6E7681" font-size="11.5">MatrixOne 不在被测名单内——下面这些是定性对照，不是性能声明。</text>
</svg>
