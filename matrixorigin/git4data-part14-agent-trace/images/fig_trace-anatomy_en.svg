<svg viewBox="0 0 1200 510" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#161B22" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="510" fill="#0D1117"/><rect width="1200" height="510" fill="url(#g)"/>
  <text x="44" y="40" fill="#E6EDF3" font-size="22" font-weight="700">Same run: a log gives you five lines of text, a trace gives you a structured tree</text>

  <rect x="44" y="66" width="330" height="196" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.3"/>
  <text x="64" y="90" fill="#9DA7B3" font-size="12.5" font-weight="700">Log · a flat event stream</text>
  <text x="64" y="116" fill="#6E7681" font-size="9.5" font-family="ui-monospace,monospace">12:04:01 INFO  retrieval done n=5</text>
  <text x="64" y="134" fill="#6E7681" font-size="9.5" font-family="ui-monospace,monospace">12:04:01 INFO  llm call tokens=420</text>
  <text x="64" y="152" fill="#F85149" font-size="9.5" font-family="ui-monospace,monospace">12:04:03 ERROR search_kb timeout</text>
  <text x="64" y="170" fill="#6E7681" font-size="9.5" font-family="ui-monospace,monospace">12:04:03 INFO  llm call tokens=510</text>
  <text x="64" y="188" fill="#F85149" font-size="9.5" font-family="ui-monospace,monospace">12:04:03 WARN  search_kb empty</text>
  <text x="64" y="220" fill="#F0883E" font-size="10">Who called whom, where the time went, where</text>
  <text x="64" y="238" fill="#F0883E" font-size="10">the tokens went — only in someone's head.</text>

  <text x="392" y="170" fill="#6E7681" font-size="24" text-anchor="middle">▶</text>

  <rect x="410" y="66" width="746" height="196" rx="10" fill="#10231A" stroke="#3FB950" stroke-width="1.5"/>
  <text x="430" y="90" fill="#3FB950" font-size="12.5" font-weight="700">Trace · one execution as a tree</text>
  <text x="672" y="90" fill="#6E7681" font-size="10">run #100387　invoke_agent "support agent v2"　2.9s · 1,645 tokens · failed</text>

  <g font-size="10" font-family="ui-monospace,monospace">
    <text x="440" y="116" fill="#9DA7B3">├─ retrieval</text>
    <text x="576" y="116" fill="#E6EDF3">fetch relevant memories</text>
    <text x="760" y="116" fill="#6E7681">120ms</text>
    <text x="830" y="116" fill="#6E7681">5 hits</text>

    <text x="440" y="140" fill="#9DA7B3">├─ llm  #1</text>
    <text x="576" y="140" fill="#E6EDF3">plan next step</text>
    <text x="760" y="140" fill="#6E7681">610ms</text>
    <text x="830" y="140" fill="#79C0FF">420 tokens</text>

    <text x="440" y="164" fill="#9DA7B3">├─ tool #1</text>
    <text x="576" y="164" fill="#E6EDF3">search_kb(...)</text>
    <text x="752" y="164" fill="#F85149">1,900ms</text>
    <text x="830" y="164" fill="#F85149">✗ timeout</text>
    <text x="940" y="164" fill="#F0883E" font-size="9.5">← 1.9s of the 2.9s stalls here</text>

    <text x="440" y="188" fill="#9DA7B3">├─ llm  #2</text>
    <text x="576" y="188" fill="#E6EDF3">rephrase and retry</text>
    <text x="760" y="188" fill="#6E7681">380ms</text>
    <text x="830" y="188" fill="#79C0FF">510 tokens</text>

    <text x="440" y="212" fill="#9DA7B3">└─ tool #2</text>
    <text x="576" y="212" fill="#E6EDF3">search_kb(...)</text>
    <text x="768" y="212" fill="#6E7681">80ms</text>
    <text x="830" y="212" fill="#F85149">✗ empty</text>
  </g>
  <text x="430" y="240" fill="#3FB950" font-size="10">Parent-child links, latency, tokens and outcome are explicit fields — so a machine can aggregate, compare and attribute directly.</text>

  <rect x="44" y="278" width="1112" height="96" rx="10" fill="#0F1622" stroke="#21262D" stroke-width="1.2"/>
  <text x="62" y="300" fill="#9DA7B3" font-size="12" font-weight="700">An agent trace differs from a microservice trace in three ways:</text>
  <text x="62" y="324" fill="#9DA7B3" font-size="10.5">1. The same input doesn't guarantee the same tree — one run takes two steps, the next takes five. A single trace says little; you need statistics over a batch.</text>
  <text x="62" y="346" fill="#9DA7B3" font-size="10.5">2. Step costs vary enormously — one LLM call is 100ms to tens of seconds, a local function is microseconds. Cost concentrates in a few spans.</text>
  <text x="62" y="368" fill="#F0883E" font-size="10.5">3. Behaviour isn't determined by code alone: a run = code/model × config × prompt × <tspan font-weight="700">the memory it read at the time</tspan> × input.</text>

  <rect x="44" y="390" width="1112" height="78" rx="10" fill="#161B22" stroke="#F85149" stroke-width="1.4"/>
  <text x="62" y="414" fill="#F85149" font-size="12.5" font-weight="700">Which leaves a gap every tracing approach shares:</text>
  <text x="62" y="438" fill="#E6EDF3" font-size="11">They all record <tspan font-weight="700">what the agent did</tspan>, and none record <tspan font-weight="700">what the world looked like to it at the time</tspan> — while memory and config keep changing.</text>
  <text x="62" y="458" fill="#6E7681" font-size="10.5">The fix: snapshot the eval set and the memory, record memory_snapshot / config_version per run, and time-travel back to that version afterwards.</text>

  <text x="44" y="492" fill="#6E7681" font-size="10.5">Collection can follow the OpenTelemetry GenAI semantic conventions (invoke_agent / plan / execute_tool / retrieval, gen_ai.* attributes) — note they are still marked Development.</text>
</svg>
