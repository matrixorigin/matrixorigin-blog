<svg viewBox="0 0 1200 490" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#161B22" stroke-width="1"/></pattern>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#6E7681"/></marker>
  </defs>
  <rect width="1200" height="490" fill="#0D1117"/><rect width="1200" height="490" fill="url(#g)"/>
  <text x="44" y="40" fill="#E6EDF3" font-size="22" font-weight="700">Memoria 建在 MatrixOne 上：Agent 用的是记忆工具，底下是版本引擎</text>

  <rect x="44" y="66" width="1112" height="56" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.3"/>
  <text x="64" y="90" fill="#9DA7B3" font-size="12" font-weight="700">你的 Agent</text>
  <text x="154" y="90" fill="#E6EDF3" font-size="12.5">Kiro　·　Cursor　·　Claude Code　·　Codex　·　OpenClaw（插件）　·　自建 Agent（MCP / REST API）</text>
  <text x="64" y="110" fill="#6E7681" font-size="11">换模型、换 Agent 工具时，记忆不必跟着迁移——它是一个独立的数据层，不是某个工具的私有状态。</text>
  <line x1="600" y1="124" x2="600" y2="144" stroke="#6E7681" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="616" y="139" fill="#6E7681" font-size="10.5">MCP / REST · stdio · SSE</text>

  <rect x="44" y="148" width="1112" height="132" rx="10" fill="#10231A" stroke="#3FB950" stroke-width="1.6"/>
  <text x="64" y="172" fill="#3FB950" font-size="13" font-weight="700">Memoria · 开源 MCP Server（Apache-2.0）</text>
  <text x="342" y="172" fill="#6E7681" font-size="11">thememoria.ai ｜ github.com/matrixorigin/Memoria</text>

  <rect x="64" y="186" width="352" height="78" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1.1"/>
  <text x="80" y="206" fill="#9DA7B3" font-size="11.5" font-weight="700">记忆工具</text>
  <text x="80" y="226" fill="#E6EDF3" font-size="10.5">store · retrieve · search · correct · purge</text>
  <text x="80" y="245" fill="#79C0FF" font-size="10.5">snapshot · branch · diff · rollback</text>
  <text x="80" y="260" fill="#6E7681" font-size="9.5">Agent 调的是工具，不直接操作数据库</text>

  <rect x="430" y="186" width="352" height="78" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1.1"/>
  <text x="446" y="206" fill="#9DA7B3" font-size="11.5" font-weight="700">六类记忆，各有生命周期</text>
  <text x="446" y="226" fill="#E6EDF3" font-size="10.5">semantic · profile · procedural</text>
  <text x="446" y="243" fill="#E6EDF3" font-size="10.5">working · tool_result · episodic</text>
  <text x="446" y="260" fill="#6E7681" font-size="9.5">working 用完即清；profile 长期保留、可查可删</text>

  <rect x="796" y="186" width="340" height="78" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1.1"/>
  <text x="812" y="206" fill="#9DA7B3" font-size="11.5" font-weight="700">自治治理（专用管线，不调 LLM）</text>
  <text x="812" y="226" fill="#E6EDF3" font-size="10.5">矛盾检测 · 低置信隔离 · 自动去重</text>
  <text x="812" y="245" fill="#6E7681" font-size="9.5">只增不减的记忆库，检索质量会随时间下降</text>
  <text x="812" y="260" fill="#6E7681" font-size="9.5">治理若每条都过一次模型，规模上来就跑不动</text>

  <line x1="600" y1="282" x2="600" y2="302" stroke="#6E7681" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="44" y="306" width="1112" height="108" rx="10" fill="#161B22" stroke="#79C0FF" stroke-width="1.6"/>
  <text x="64" y="330" fill="#79C0FF" font-size="13" font-weight="700">MatrixOne · 一套引擎里的检索与版本能力　←　本文第六节用 SQL 直接操作的就是这一层</text>

  <rect x="64" y="344" width="256" height="56" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1.1"/>
  <text x="192" y="365" fill="#E6EDF3" font-size="11.5" text-anchor="middle" font-weight="700">向量 + 全文混合检索</text>
  <text x="192" y="385" fill="#6E7681" font-size="9.5" text-anchor="middle">存「black formatter」，问「格式化工具」也能找到</text>

  <rect x="334" y="344" width="256" height="56" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1.1"/>
  <text x="462" y="365" fill="#E6EDF3" font-size="11.5" text-anchor="middle" font-weight="700">关系查询与约束</text>
  <text x="462" y="385" fill="#6E7681" font-size="9.5" text-anchor="middle">按用户 / 项目 / 有效期 / 权限精确过滤</text>

  <rect x="604" y="344" width="532" height="56" rx="8" fill="#0D1117" stroke="#3FB950" stroke-width="1.3"/>
  <text x="870" y="365" fill="#3FB950" font-size="11.5" text-anchor="middle" font-weight="700">Git4Data · Copy-on-Write 版本引擎</text>
  <text x="870" y="385" fill="#9DA7B3" font-size="10" text-anchor="middle">snapshot → branch → diff → merge → rollback　零拷贝、毫秒级元数据操作</text>

  <text x="44" y="442" fill="#6E7681" font-size="11.5">边界：confidence、source_run、记忆类型与冲突判定，是 Memoria 或业务应用的策略；branch / DIFF / merge / snapshot / restore 是 MatrixOne 提供的底层能力。</text>
  <text x="44" y="464" fill="#6E7681" font-size="11.5">Git4Data 不替 Agent 判断「什么应该被记住」，但它保证这个判断过程有隔离区、有变更记录，并且可以撤销。</text>
</svg>
