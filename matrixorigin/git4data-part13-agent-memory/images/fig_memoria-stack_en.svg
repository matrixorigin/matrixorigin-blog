<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#161B22" stroke-width="1"/></pattern>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#6E7681"/></marker>
  </defs>
  <rect width="1200" height="480" fill="#0D1117"/><rect width="1200" height="480" fill="url(#g)"/>
  <text x="44" y="40" fill="#E6EDF3" font-size="22" font-weight="700">Memoria is built on MatrixOne — this article&#39;s SQL is its bottom layer</text>

  <!-- agents -->
  <rect x="44" y="66" width="1112" height="58" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.3"/>
  <text x="64" y="90" fill="#9DA7B3" font-size="12" font-weight="700">Agent side</text>
  <text x="146" y="90" fill="#E6EDF3" font-size="12.5">Cursor  ·  Claude Code  ·  Kiro  ·  OpenClaw  —  any MCP-capable agent connects directly, no custom integration</text>
  <text x="64" y="111" fill="#6E7681" font-size="11">The agent decides when to write and when to look things up; it sees tool calls, never SQL.</text>
  <line x1="600" y1="126" x2="600" y2="146" stroke="#6E7681" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="616" y="141" fill="#6E7681" font-size="10.5">MCP</text>

  <!-- memoria -->
  <rect x="44" y="150" width="1112" height="126" rx="10" fill="#10231A" stroke="#3FB950" stroke-width="1.6"/>
  <text x="64" y="174" fill="#3FB950" font-size="13" font-weight="700">Memoria · open-source MCP Server (Apache 2.0)</text>
  <text x="330" y="174" fill="#6E7681" font-size="11">github.com/matrixorigin/Memoria</text>

  <rect x="64" y="188" width="336" height="72" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1.1"/>
  <text x="80" y="208" fill="#9DA7B3" font-size="11.5" font-weight="700">memory tools</text>
  <text x="80" y="228" fill="#E6EDF3" font-size="11">store · retrieve · search · correct · purge</text>
  <text x="80" y="248" fill="#6E7681" font-size="10.5">governance · consolidate · reflect · feedback</text>

  <rect x="414" y="188" width="336" height="72" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1.1"/>
  <text x="430" y="208" fill="#9DA7B3" font-size="11.5" font-weight="700">memory types &amp; governance</text>
  <text x="430" y="228" fill="#E6EDF3" font-size="11">profile (long-lived) / working (purged at session end) / goals</text>
  <text x="430" y="248" fill="#6E7681" font-size="10.5">contradiction detection · low-confidence quarantine · correct in place, don&#39;t append</text>

  <rect x="764" y="188" width="372" height="72" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1.1"/>
  <text x="780" y="208" fill="#9DA7B3" font-size="11.5" font-weight="700">backup &amp; restore (a product feature)</text>
  <text x="780" y="228" fill="#E6EDF3" font-size="11">snapshot at any moment, one-click restore when it goes wrong</text>
  <text x="780" y="248" fill="#6E7681" font-size="10.5">catches gradual drift — the kind you can&#39;t pin on any one conversation</text>

  <line x1="600" y1="278" x2="600" y2="298" stroke="#6E7681" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- matrixone -->
  <rect x="44" y="302" width="1112" height="106" rx="10" fill="#161B22" stroke="#79C0FF" stroke-width="1.6"/>
  <text x="64" y="326" fill="#79C0FF" font-size="13" font-weight="700">MatrixOne · CoW storage engine  ←  the layer this article drives directly in SQL</text>

  <rect x="64" y="340" width="216" height="52" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1.1"/>
  <text x="172" y="360" fill="#E6EDF3" font-size="11.5" text-anchor="middle" font-weight="700">zero-copy branch</text>
  <text x="172" y="379" fill="#6E7681" font-size="10">DATA BRANCH CREATE / MERGE</text>

  <rect x="294" y="340" width="216" height="52" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1.1"/>
  <text x="402" y="360" fill="#E6EDF3" font-size="11.5" text-anchor="middle" font-weight="700">row-level DIFF</text>
  <text x="402" y="379" fill="#6E7681" font-size="10" text-anchor="middle">what exactly this round remembered</text>

  <rect x="524" y="340" width="216" height="52" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1.1"/>
  <text x="632" y="360" fill="#E6EDF3" font-size="11.5" text-anchor="middle" font-weight="700">instant snapshot / rollback</text>
  <text x="632" y="379" fill="#6E7681" font-size="10" text-anchor="middle">CREATE SNAPSHOT / RESTORE</text>

  <rect x="754" y="340" width="382" height="52" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1.1"/>
  <text x="945" y="360" fill="#E6EDF3" font-size="11.5" text-anchor="middle" font-weight="700">vector index + full-text search in the same engine</text>
  <text x="945" y="379" fill="#6E7681" font-size="10" text-anchor="middle">hybrid-retrieve the memories relevant to the task, without moving data again</text>

  <text x="44" y="434" fill="#6E7681" font-size="11.5">Memoria began as the memory layer for MatrixOne&#39;s vector-search auto-tuning — &#34;remember which tuning strategies worked&#34; and</text>
  <text x="44" y="452" fill="#6E7681" font-size="11.5">&#34;remember how your project works&#34; are the same problem in the abstract. What deserves remembering, where the confidence bar sits, and</text>
  <text x="44" y="470" fill="#6E7681" font-size="11.5">whether a contradiction is a changed mind or a misread are still policy calls — the engine only makes them executable, traceable, reversible.</text>
</svg>
