<svg viewBox="0 0 1200 510" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#161B22" stroke-width="1"/></pattern>
    <marker id="ax" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#6E7681"/></marker>
  </defs>
  <rect width="1200" height="510" fill="#0D1117"/><rect width="1200" height="510" fill="url(#g)"/>
  <text x="44" y="40" fill="#E6EDF3" font-size="22" font-weight="700">A structural trade-off: today's systems sit in two corners, and the top-right is empty</text>

  <!-- axes -->
  <line x1="120" y1="410" x2="620" y2="410" stroke="#6E7681" stroke-width="1.6" marker-end="url(#ax)"/>
  <line x1="120" y1="410" x2="120" y2="92" stroke="#6E7681" stroke-width="1.6" marker-end="url(#ax)"/>
  <text x="614" y="428" fill="#9DA7B3" font-size="11" font-weight="700" text-anchor="end">cheaper branch management ▶</text>
  <text x="120" y="80" fill="#9DA7B3" font-size="11" font-weight="700" text-anchor="middle">faster branch-local queries</text>

  <!-- empty quadrant -->
  <rect x="386" y="112" width="234" height="136" rx="10" fill="#0F1622" stroke="#3FB950" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="503" y="146" fill="#3FB950" font-size="13" text-anchor="middle" font-weight="700">nothing is here</text>
  <text x="503" y="170" fill="#9DA7B3" font-size="10.5" text-anchor="middle">cheap · concurrent · query-efficient</text>
  <text x="503" y="194" fill="#6E7681" font-size="10" text-anchor="middle">plus the one thing every system lacks:</text>
  <text x="503" y="214" fill="#F0883E" font-size="10.5" text-anchor="middle" font-weight="700">native cross-branch aggregation</text>
  <text x="503" y="236" fill="#6E7681" font-size="9.5" text-anchor="middle">"That system does not exist yet."</text>

  <!-- Neon -->
  <circle cx="180" cy="146" r="9" fill="#79C0FF"/>
  <text x="198" y="142" fill="#E6EDF3" font-size="13" font-weight="700">Neon</text>
  <text x="198" y="162" fill="#6E7681" font-size="10">one compute instance per branch</text>
  <text x="198" y="179" fill="#F85149" font-size="10">25x slower create, 1500x slower switch</text>
  <text x="198" y="196" fill="#F85149" font-size="10">hard cap: 20 concurrent live branches</text>

  <!-- Dolt -->
  <circle cx="548" cy="352" r="9" fill="#A371F7"/>
  <text x="200" y="292" fill="#E6EDF3" font-size="13" font-weight="700">Dolt</text>
  <text x="200" y="312" fill="#6E7681" font-size="10">content-addressed tree; a branch is a pointer</text>
  <text x="200" y="329" fill="#F85149" font-size="10">range scans 2–4000x slower</text>
  <text x="200" y="346" fill="#F85149" font-size="10">throughput plateaus at 4 branches</text>
  <path d="M400 334 C 462 340, 510 346, 537 351" fill="none" stroke="#30363D" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- others -->
  <circle cx="150" cy="374" r="6" fill="#6E7681"/>
  <text x="166" y="378" fill="#6E7681" font-size="10">Xata / TigerData: orders of magnitude slower to branch; not yet mature</text>
  <circle cx="150" cy="396" r="6" fill="#6E7681"/>
  <text x="166" y="400" fill="#6E7681" font-size="10">PG txn/savepoint and file-copy clone: hold only in very narrow cases</text>

  <!-- right panel -->
  <rect x="694" y="92" width="462" height="330" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.3"/>
  <text x="712" y="118" fill="#E6EDF3" font-size="12.5" font-weight="700">Two failure modes — both architectural, not tuning</text>

  <text x="712" y="150" fill="#79C0FF" font-size="11.5" font-weight="700">Neon · the 20-branch cap</text>
  <text x="712" y="170" fill="#9DA7B3" font-size="10.5">A compute instance per branch buys fast queries and near-linear</text>
  <text x="712" y="187" fill="#9DA7B3" font-size="10.5">read throughput — but create/switch are costly, and it stops dead</text>
  <text x="712" y="204" fill="#9DA7B3" font-size="10.5">at the cap.</text>
  <text x="712" y="223" fill="#6E7681" font-size="10">33 of 1,000 MCTS steps · 4.0 GB storage on Software Dev</text>

  <text x="712" y="256" fill="#A371F7" font-size="11.5" font-weight="700">Dolt · the 4-branch plateau</text>
  <text x="712" y="276" fill="#9DA7B3" font-size="10.5">All branches share one process and a fixed resource pool, so</text>
  <text x="712" y="293" fill="#9DA7B3" font-size="10.5">branching is nearly free — but a branch brings no compute, and</text>
  <text x="712" y="310" fill="#9DA7B3" font-size="10.5">reads walk a tree that grows with branch count.</text>
  <text x="712" y="329" fill="#6E7681" font-size="10">170 of 1,000 MCTS steps · Simulation never finished gracefully</text>

  <line x1="712" y1="348" x2="1138" y2="348" stroke="#21262D" stroke-width="1.2"/>
  <text x="712" y="370" fill="#3FB950" font-size="11.5" font-weight="700">The instructive contrast (microbenchmark)</text>
  <text x="712" y="389" fill="#9DA7B3" font-size="10.5">More branches don't slow a single branch — both isolate correctly.</text>
  <text x="712" y="406" fill="#9DA7B3" font-size="10.5">But: Neon scales near-linearly to its cap; Dolt is flat at 4.</text>

  <text x="44" y="452" fill="#6E7681" font-size="11">Figures from BranchBench (arXiv:2604.17180). Neon was tested via its hosted service, Dolt self-built on a c8i.4xlarge;</text>
  <text x="44" y="472" fill="#6E7681" font-size="11">the paper notes Neon's storage statistics are order-of-magnitude only.</text>
  <text x="44" y="494" fill="#6E7681" font-size="11">MatrixOne was not among the systems tested — what the article draws from this is a qualitative comparison, not a performance claim.</text>
</svg>
