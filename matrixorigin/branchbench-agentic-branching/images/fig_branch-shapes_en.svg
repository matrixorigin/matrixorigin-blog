<svg viewBox="0 0 1200 490" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#161B22" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="490" fill="#0D1117"/><rect width="1200" height="490" fill="url(#g)"/>
  <text x="44" y="40" fill="#E6EDF3" font-size="22" font-weight="700">A developer's branches and an agent's branches are not the same shape</text>
  <text x="44" y="64" fill="#F0883E" font-size="12.5" font-weight="700">BranchBench's five workloads are built around the shapes on the right</text>

  <!-- developer -->
  <rect x="44" y="86" width="238" height="190" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.4"/>
  <text x="62" y="110" fill="#9DA7B3" font-size="12.5" font-weight="700">Developer</text>
  <circle cx="80" cy="150" r="6" fill="#79C0FF"/><text x="80" y="176" fill="#6E7681" font-size="9.5" text-anchor="middle">main</text>
  <line x1="86" y1="150" x2="158" y2="132" stroke="#6E7681" stroke-width="1.4"/>
  <line x1="86" y1="150" x2="158" y2="168" stroke="#6E7681" stroke-width="1.4"/>
  <circle cx="164" cy="130" r="6" fill="#3FB950"/><circle cx="164" cy="170" r="6" fill="#3FB950"/>
  <text x="178" y="134" fill="#9DA7B3" font-size="10">feature/…</text>
  <text x="178" y="174" fill="#9DA7B3" font-size="10">staging</text>
  <text x="62" y="212" fill="#6E7681" font-size="10">a handful of branches, living</text>
  <text x="62" y="227" fill="#6E7681" font-size="10">for days or weeks</text>
  <text x="62" y="245" fill="#6E7681" font-size="10">created by hand; a human</text>
  <text x="62" y="260" fill="#6E7681" font-size="10">presses enter</text>

  <!-- agent header -->
  <text x="318" y="106" fill="#9DA7B3" font-size="12.5" font-weight="700">Agent: one task can run branch → mutate → evaluate → prune a thousand times</text>

  <!-- deep narrow -->
  <rect x="318" y="118" width="200" height="158" rx="10" fill="#161B22" stroke="#A371F7" stroke-width="1.4"/>
  <text x="334" y="140" fill="#A371F7" font-size="11" font-weight="700">deep &amp; narrow · MCTS</text>
  <g stroke="#6E7681" stroke-width="1.2">
    <line x1="418" y1="156" x2="394" y2="176"/><line x1="418" y1="156" x2="442" y2="176"/>
    <line x1="394" y1="176" x2="378" y2="196"/><line x1="394" y1="176" x2="410" y2="196"/>
    <line x1="378" y1="196" x2="370" y2="214"/><line x1="410" y1="196" x2="418" y2="214"/>
  </g>
  <g fill="#A371F7"><circle cx="418" cy="156" r="4"/><circle cx="394" cy="176" r="4"/><circle cx="442" cy="176" r="4"/><circle cx="378" cy="196" r="4"/><circle cx="410" cy="196" r="4"/><circle cx="370" cy="214" r="4"/><circle cx="418" cy="214" r="4"/></g>
  <text x="334" y="238" fill="#6E7681" font-size="9.5">tens to hundreds of levels,</text>
  <text x="334" y="251" fill="#6E7681" font-size="9.5">3–10 children each</text>
  <text x="334" y="268" fill="#6E7681" font-size="9.5">stresses: metadata scale, live branches</text>

  <!-- wide flat -->
  <rect x="530" y="118" width="200" height="158" rx="10" fill="#161B22" stroke="#F0883E" stroke-width="1.4"/>
  <text x="546" y="140" fill="#F0883E" font-size="11" font-weight="700">very wide, flat · simulation</text>
  <g stroke="#6E7681" stroke-width="1.1">
    <line x1="630" y1="158" x2="566" y2="194"/><line x1="630" y1="158" x2="588" y2="194"/><line x1="630" y1="158" x2="610" y2="194"/>
    <line x1="630" y1="158" x2="630" y2="194"/><line x1="630" y1="158" x2="650" y2="194"/><line x1="630" y1="158" x2="672" y2="194"/><line x1="630" y1="158" x2="694" y2="194"/>
  </g>
  <circle cx="630" cy="158" r="4.5" fill="#F0883E"/>
  <g fill="#F0883E"><circle cx="566" cy="197" r="3.5"/><circle cx="588" cy="197" r="3.5"/><circle cx="610" cy="197" r="3.5"/><circle cx="630" cy="197" r="3.5"/><circle cx="650" cy="197" r="3.5"/><circle cx="672" cy="197" r="3.5"/><circle cx="694" cy="197" r="3.5"/></g>
  <text x="630" y="215" fill="#6E7681" font-size="9" text-anchor="middle">…1,000 forks at once…</text>
  <text x="546" y="238" fill="#6E7681" font-size="9.5">one cross-branch aggregation,</text>
  <text x="546" y="251" fill="#6E7681" font-size="9.5">then discard everything</text>
  <text x="546" y="268" fill="#6E7681" font-size="9.5">stresses: bulk creation, throughput, GC</text>

  <!-- bushy -->
  <rect x="742" y="118" width="200" height="158" rx="10" fill="#161B22" stroke="#3FB950" stroke-width="1.4"/>
  <text x="758" y="140" fill="#3FB950" font-size="11" font-weight="700">bushy · software engineering</text>
  <g stroke="#6E7681" stroke-width="1.2">
    <line x1="842" y1="158" x2="802" y2="182"/><line x1="842" y1="158" x2="842" y2="182"/><line x1="842" y1="158" x2="882" y2="182"/>
    <line x1="802" y1="182" x2="786" y2="208"/><line x1="802" y1="182" x2="818" y2="208"/>
    <line x1="882" y1="182" x2="870" y2="208"/>
  </g>
  <g fill="#3FB950"><circle cx="842" cy="158" r="4"/><circle cx="802" cy="182" r="4"/><circle cx="842" cy="182" r="4"/><circle cx="882" cy="182" r="4"/><circle cx="786" cy="208" r="4"/><circle cx="818" cy="208" r="4"/><circle cx="870" cy="208" r="4"/></g>
  <text x="758" y="238" fill="#6E7681" font-size="9.5">the whole iteration is speculative</text>
  <text x="758" y="251" fill="#6E7681" font-size="9.5">until every test passes</text>
  <text x="758" y="268" fill="#6E7681" font-size="9.5">stresses: schema + backfill + read tests</text>

  <!-- wide shallow -->
  <rect x="954" y="118" width="202" height="158" rx="10" fill="#161B22" stroke="#79C0FF" stroke-width="1.4"/>
  <text x="970" y="140" fill="#79C0FF" font-size="11" font-weight="700">wide, shallow · data curation</text>
  <g stroke="#6E7681" stroke-width="1.2">
    <line x1="1052" y1="158" x2="998" y2="182"/><line x1="1052" y1="158" x2="1034" y2="182"/><line x1="1052" y1="158" x2="1070" y2="182"/><line x1="1052" y1="158" x2="1106" y2="182"/>
    <line x1="998" y1="182" x2="990" y2="206"/><line x1="998" y1="182" x2="1006" y2="206"/>
    <line x1="1106" y1="182" x2="1098" y2="206"/><line x1="1106" y1="182" x2="1114" y2="206"/>
  </g>
  <g fill="#79C0FF"><circle cx="1052" cy="158" r="4"/><circle cx="998" cy="182" r="4"/><circle cx="1034" cy="182" r="4"/><circle cx="1070" cy="182" r="4"/><circle cx="1106" cy="182" r="4"/><circle cx="990" cy="206" r="3.5"/><circle cx="1006" cy="206" r="3.5"/><circle cx="1098" cy="206" r="3.5"/><circle cx="1114" cy="206" r="3.5"/></g>
  <text x="970" y="238" fill="#6E7681" font-size="9.5">one branch per anomaly,</text>
  <text x="970" y="251" fill="#6E7681" font-size="9.5">compared side by side</text>
  <text x="970" y="268" fill="#6E7681" font-size="9.5">stresses: cross-branch reads</text>

  <!-- bottom band -->
  <rect x="44" y="300" width="1112" height="98" rx="10" fill="#0F1622" stroke="#21262D" stroke-width="1.2"/>
  <text x="62" y="324" fill="#9DA7B3" font-size="12" font-weight="700">It isn't only the count that changes — three other things do:</text>
  <text x="62" y="348" fill="#9DA7B3" font-size="11">1. Mutations aren't only logical (UPDATE) but physical (CREATE INDEX, materialised structures, config) — the agent is often evaluating the design itself.</text>
  <text x="62" y="368" fill="#9DA7B3" font-size="11">2. Evaluation is often cross-branch: "which cleaning path is best", "what's the distribution over 1,000 trials" — the answer lives in no single branch.</text>
  <text x="62" y="388" fill="#9DA7B3" font-size="11">3. Branch lifecycle becomes the dominant cost: at several branches per second, creation latency sets how many hypotheses fit in a unit of time.</text>

  <text x="44" y="430" fill="#F85149" font-size="12.5" font-weight="700">BranchBench's finding: across five workloads with a two-hour timeout, not one of the six systems finished.</text>
  <text x="44" y="454" fill="#6E7681" font-size="11">Systems tested: Neon · DoltgreSQL · TigerData · Xata · PostgreSQL txn/savepoint · PostgreSQL 18 file-copy clone.</text>
  <text x="44" y="472" fill="#6E7681" font-size="11">MatrixOne was not among them.</text>
</svg>
